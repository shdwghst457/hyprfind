[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hyprfind"
version = "0.1.0"
description = "Finder-quality file manager for Hyprland/Linux"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-or-later" }
dependencies = ["PyQt6>=6.6"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
hyprfind = "hyprfind.app:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["hyprfind*"]

[tool.setuptools.package-data]
hyprfind = ["ui/styles/*.qss", "ui/styles/icons/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
